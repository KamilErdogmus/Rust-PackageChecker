[package]
name = "system-update-manager"
version = "1.0.2"
description = "Cross-platform system update manager for Windows, macOS, and Linux"
authors = ["System Update Manager Team"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "system_update_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
opt-level = 1
incremental = true
debug = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[dev-dependencies]
proptest = "1.11"
tokio-test = "0.4"
mockall = "0.14"
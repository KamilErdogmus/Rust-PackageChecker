[package]
name = "system-update-manager"
version = "1.0.1"
description = "Cross-platform system update manager for Windows, macOS, and Linux"
authors = ["System Update Manager Team"]
edition = "2024"
rust-version = "1.95"

[lib]
name = "system_update_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
opt-level = 1        # Minimal optimizations for faster compile
incremental = true   # Incremental compilation (default but explicit)
debug = true

[profile.release]
opt-level = "z"      # Optimize for size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization, slower compile
strip = true         # Strip symbols
# Speed up build times
[profile.dev.package."*"]
opt-level = 3        # Optimize dependencies in dev mode

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[dev-dependencies]
proptest = "1.11"
tokio-test = "0.4"
mockall = "0.14"
